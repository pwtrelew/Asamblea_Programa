    <!-- Lógica de registro del Service Worker y Detección de Actualizaciones -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => {
              // Detectar cuando hay una nueva versión esperando para instalarse
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // Disparar un evento para que React muestre el botón de "Actualizar"
                    window.dispatchEvent(new CustomEvent('swUpdated', { detail: reg }));
                  }
                });
              });
            })
            .catch(err => console.error('Error al registrar SW', err));
        });

        // Cuando el Service Worker se actualice, recargar la página
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      }
    </script>

        function App() {
          const [isDbReady, setIsDbReady] = useState(false);
          const [currentScreen, setCurrentScreen] = useState('login');
          const [currentUser, setCurrentUser] = useState(null);
          const [usersDB, setUsersDB] = useState([]);
          
          const [activeTab, setActiveTab] = useState('viernes');
          const [notes, setNotes] = useState({});
          const [expandedItems, setExpandedItems] = useState({});
          const [fontSize, setFontSize] = useState(16);
          const [isMenuOpen, setIsMenuOpen] = useState(false);
          const [isExporting, setIsExporting] = useState(false);
          
          const [loginForm, setLoginForm] = useState({ username: '' });
          const [loginError, setLoginError] = useState('');
          const [isLoggingIn, setIsLoggingIn] = useState(false);
          
          const [newUserForm, setNewUserForm] = useState({ username: '' });
          const [adminMessage, setAdminMessage] = useState({ type: '', text: '' });
          const [isCreatingUser, setIsCreatingUser] = useState(false);

          // PWA Install / Update States
          const [deferredPrompt, setDeferredPrompt] = useState(null);
          const [isInstallable, setIsInstallable] = useState(false);
          const [updateAvailable, setUpdateAvailable] = useState(null);

          const themeColors = {
            viernes: {
              main: 'bg-purple-800', text: 'text-purple-800', hoverBg: 'hover:bg-purple-800', hoverText: 'hover:text-purple-800',
              light: 'bg-purple-100', lightText: 'text-purple-900', border: 'border-purple-200', ring: 'focus:ring-purple-500',
              icon: 'text-purple-700', bgLight: 'bg-purple-50', hoverBgLight: 'hover:bg-purple-50'
            },
            sabado: {
              main: 'bg-sky-700', text: 'text-sky-700', hoverBg: 'hover:bg-sky-700', hoverText: 'hover:text-sky-700',
              light: 'bg-sky-100', lightText: 'text-sky-900', border: 'border-sky-200', ring: 'focus:ring-sky-500',
              icon: 'text-sky-700', bgLight: 'bg-sky-50', hoverBgLight: 'hover:bg-sky-50'
            },
            domingo: {
              main: 'bg-rose-800', text: 'text-rose-800', hoverBg: 'hover:bg-rose-800', hoverText: 'hover:text-rose-800',
              light: 'bg-rose-100', lightText: 'text-rose-900', border: 'border-rose-200', ring: 'focus:ring-rose-500',
              icon: 'text-rose-700', bgLight: 'bg-rose-50', hoverBgLight: 'hover:bg-rose-50'
            }
          };

          const currentTheme = themeColors[activeTab] || themeColors['viernes'];

          // Escuchar eventos de actualización de la App
          useEffect(() => {
            const handler = (e) => setUpdateAvailable(e.detail);
            window.addEventListener('swUpdated', handler);
            return () => window.removeEventListener('swUpdated', handler);
          }, []);

          const handleUpdateApp = () => {
            if (updateAvailable && updateAvailable.waiting) {
              // Le dice al Service Worker que se salte la espera y actualice
              updateAvailable.waiting.postMessage({ type: 'SKIP_WAITING' });
            }
          };

          // Inicializar Firebase
          useEffect(() => {
            if (!auth) {
                setLoginError("Error interno: Firebase no está configurado.");
                return;
            }
            signInAnonymously(auth).then(() => {
              setIsDbReady(true);
            }).catch((error) => {
              setLoginError("Error conectando a la base de datos.");
            });
          }, []);

          // Verificar sesión persistente (Auto-login)
          useEffect(() => {
              if (isDbReady) {
                  const savedUserStr = localStorage.getItem('asamblea-session');
                  if (savedUserStr) {
                      try {
                          const savedUser = JSON.parse(savedUserStr);
                          loadUserNotes(savedUser.username).then(() => {
                              setCurrentUser(savedUser);
                              setCurrentScreen('main');
                          });
                      } catch (e) {
                          localStorage.removeItem('asamblea-session');
                      }
                  }
              }
          }, [isDbReady]);

          // Escuchar botón de instalación nativo
          useEffect(() => {
            const handler = (e) => {
              e.preventDefault();
              setDeferredPrompt(e);
              setIsInstallable(true);
            };
            window.addEventListener('beforeinstallprompt', handler);
            window.addEventListener('appinstalled', () => setIsInstallable(false));
            return () => window.removeEventListener('beforeinstallprompt', handler);
          }, []);

          const handleInstallClick = async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') setIsInstallable(false);
            setDeferredPrompt(null);
          };

          // Autoguardado en Firestore
          useEffect(() => {
            if (!currentUser || !isDbReady || !db) return;
            const timeoutId = setTimeout(async () => {
              try {
                const notesRef = doc(db, 'notes', currentUser.username);
                await setDoc(notesRef, { notes, fontSize }, { merge: true });
              } catch (err) {}
            }, 1500);
            return () => clearTimeout(timeoutId);
          }, [notes, fontSize, currentUser, isDbReady]);

          const loadAllUsers = async () => {
            if (!db) return;
            try {
              const usersRef = collection(db, 'users');
              const snap = await getDocs(usersRef);
              const loadedUsers = [];
              snap.forEach(document => {
                loadedUsers.push({ username: document.id, role: document.data().role });
              });
              setUsersDB(loadedUsers);
            } catch (err) {}
          };

          // Lógica de inicio de sesión sin contraseña
          const handleLogin = async (e) => {
            e.preventDefault();
            if (!loginForm.username || !isDbReady || !db) return;
            setIsLoggingIn(true);
            setLoginError('');
            
            const uname = loginForm.username.toLowerCase().trim();
            
            try {
              if (uname === 'admin') {
                const adminRef = doc(db, 'users', 'admin');
                await setDoc(adminRef, { role: 'admin' }, { merge: true });
                await loadUserNotes('admin');
                const adminObj = { username: 'admin', role: 'admin' };
                setCurrentUser(adminObj);
                localStorage.setItem('asamblea-session', JSON.stringify(adminObj));
                setCurrentScreen('main');
              } else {
                const userRef = doc(db, 'users', uname);
                const userSnap = await getDoc(userRef);

                if (userSnap.exists()) {
                  const userData = userSnap.data();
                  await loadUserNotes(uname);
                  const userObj = { username: uname, role: userData.role };
                  setCurrentUser(userObj);
                  localStorage.setItem('asamblea-session', JSON.stringify(userObj));
                  setCurrentScreen('main');
                  setLoginForm({ username: '' });
                } else {
                  setLoginError('Usuario no registrado. Pídele al administrador que cree tu acceso.');
                }
              }
            } catch (err) {
              setLoginError('Error de conexión con el servidor.');
            }
            setIsLoggingIn(false);
          };

          const loadUserNotes = async (uname) => {
            if (!db) return;
            try {
              const notesRef = doc(db, 'notes', uname);
              const notesSnap = await getDoc(notesRef);
              if (notesSnap.exists()) {
                const data = notesSnap.data();
                if (data.notes) setNotes(data.notes);
                if (data.fontSize) setFontSize(data.fontSize);
              } else {
                setNotes({});
                setFontSize(16);
              }
            } catch (err) {}
          };

          // Creación de usuario sin contraseña
          const handleCreateUser = async (e) => {
            if (e) e.preventDefault();
            setAdminMessage({ type: '', text: '' });
            if (!newUserForm.username || !isDbReady || !db) return;
            setIsCreatingUser(true);
            
            const uname = newUserForm.username.toLowerCase().trim();
            
            try {
              const userRef = doc(db, 'users', uname);
              const userSnap = await getDoc(userRef);
              
              if (userSnap.exists()) {
                setAdminMessage({ type: 'error', text: 'Ese usuario ya existe.' });
              } else {
                await setDoc(userRef, { role: 'user' });
                setAdminMessage({ type: 'success', text: 'Usuario creado con éxito.' });
                setNewUserForm({ username: '' });
                loadAllUsers();
              }
            } catch (err) {
              setAdminMessage({ type: 'error', text: 'Error de conexión.' });
            }
            
            setIsCreatingUser(false);
            setTimeout(() => setAdminMessage({ type: '', text: '' }), 3000);
          };

          const handleLogout = () => {
            localStorage.removeItem('asamblea-session');
            setCurrentUser(null);
            setNotes({});
            setCurrentScreen('login');
            setIsMenuOpen(false);
          };

          const handleNoteChange = (id, text) => {
            if (!id.startsWith('attendance_') && !text.startsWith("Orador: ")) {
              text = "Orador: " + text.replace(/^Orador:\s*/, "");
            }
            setNotes(prev => ({ ...prev, [id]: text }));
          };

          const handleNoteFocus = (id, event) => {
             if (!id.startsWith('attendance_') && (!notes[id] || notes[id].trim() === "")) {
                 handleNoteChange(id, "Orador: ");
             }
             setTimeout(() => {
                 const rect = event.target.getBoundingClientRect();
                 const screenHeight = window.innerHeight;
                 if (rect.bottom > screenHeight * 0.6) {
                     event.target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                 }
             }, 300);
          };

          const toggleItem = (id) => setExpandedItems(prev => ({ ...prev, [id]: !prev[id] }));
          const increaseFontSize = () => setFontSize(prev => Math.min(prev + 32, 32)); // max 32
          const decreaseFontSize = () => setFontSize(prev => Math.max(prev - 2, 12)); // min 12

          const renderAttendanceInput = (sessionType) => {
            const idPresencial = `attendance_presencial_${activeTab}_${sessionType}`;
            const idStream = `attendance_stream_${activeTab}_${sessionType}`;

            const presencial = parseInt(notes[idPresencial]) || 0;
            const stream = parseInt(notes[idStream]) || 0;
            const total = presencial + stream;

            return (
              <div className={`mt-6 mb-2 bg-white rounded-2xl p-5 shadow-sm border ${currentTheme.border}`}>
                <div className="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                  <div className="flex items-center gap-2">
                    <Users size={20} className={currentTheme.icon} />
                    <span className="font-bold text-slate-700">Asistencia ({sessionType === 'manana' ? 'Mañana' : 'Tarde'})</span>
                  </div>
                  <div className={`font-black text-lg ${total > 0 ? currentTheme.text : 'text-slate-300'}`}>
                    Total: {total}
                  </div>
                </div>
                
                <div className="grid grid-cols-2 gap-4">
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 flex flex-col items-center">
                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 flex items-center gap-1">
                      <Users size={12}/> Presencial
                    </label>
                    <input
                      type="number"
                      value={notes[idPresencial] || ''}
                      onChange={(e) => setNotes(prev => ({ ...prev, [idPresencial]: e.target.value }))}
                      onFocus={(e) => handleNoteFocus(idPresencial, e)}
                      className={`w-full p-2.5 border border-slate-300 rounded-lg text-center font-bold text-slate-700 text-lg focus:ring-2 ${currentTheme.ring} focus:outline-none bg-white shadow-sm`}
                      placeholder="0"
                    />
                  </div>

                          {item.type === 'symposium' && (
                            <div className="mt-5 space-y-5">
                              {item.parts.map(part => {
                                const partTitleMatch = part.title.match(/^(.*?)\s*(\(.*?\))?$/);
                                const pMainTitle = partTitleMatch ? partTitleMatch[1] : part.title;
                                const pBibleRef = partTitleMatch && partTitleMatch[2] ? partTitleMatch[2] : null;
                                
                                return (
                                  <div key={part.id} className="pt-3 border-t border-slate-100">
                                    <div 
                                      className="cursor-pointer select-none flex justify-between items-start"
                                      onClick={() => toggleItem(part.id)}
                                    >
                                      <div className="flex-1 pr-2">
                                        <h4 className="font-semibold text-slate-700 flex items-start gap-2 leading-tight">
                                          <BookOpen size={16} className={`${currentTheme.icon} mt-1 shrink-0`} />
                                          <span>{pMainTitle}</span>
                                        </h4>
                                        {pBibleRef && (
                                          <span className={`block mt-1 ml-6 text-sm font-semibold ${currentTheme.text} opacity-80`}>
                                            {pBibleRef}
                                          </span>
                                        )}
                                      </div>
                                      {expandedItems[part.id] ? <ChevronUp size={20} className={`${currentTheme.text} shrink-0 mt-1`} /> : <ChevronDown size={20} className={`${currentTheme.text} shrink-0 mt-1`} />}
                                    </div>
                                    {expandedItems[part.id] && renderNoteField(part.id)}
                                  </div>
                                );
                              })}
                            </div>
                          )}
                        </div>
                        
                        {isLastMorningItem && renderAttendanceInput('manana')}
                        {isLastAfternoonItem && renderAttendanceInput('tarde')}
                        
                      </React.Fragment>
                    );
                  })}
                </div>
              </main>
            </div>
          );
        }

        class ErrorBoundary extends React.Component {
          constructor(props) {
            super(props);
            this.state = { hasError: false, error: null };
          }
          static getDerivedStateFromError(error) {
            return { hasError: true, error };
          }
          render() {
            if (this.state.hasError) {
              return (
                <div className="min-h-screen flex items-center justify-center bg-slate-50 p-4">
                  <div className="bg-white p-6 rounded-xl border border-red-200 shadow-xl max-w-lg text-center">
                    <h1 className="text-red-600 font-bold text-xl mb-2">Algo salió mal</h1>
                    <p className="text-slate-600 text-sm mb-4">La aplicación detectó un problema. Por favor recarga la página.</p>
                    <code className="block bg-slate-100 p-3 rounded text-left text-xs text-red-500 overflow-auto">{this.state.error?.toString()}</code>
                  </div>
                </div>
              );
            }
            return this.props.children;
          }
        }

        const root = createRoot(document.getElementById('root'));
        root.render(
          <ErrorBoundary>
            <App />
          </ErrorBoundary>
        );
    </script>
</body>
</html>
