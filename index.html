        const songLyrics = {
          'v2': { title: '160. Ya veo a mi nuevo yo', text: `1. En el paraíso que va a llegar,\ncon todo detalle me suelo mirar:\nla Tierra perfecta, limpia, feliz,\nlas flores que adornan de un tono carmín.\n\n(ESTRIBILLO)\nCierro los ojos... ¿qué es lo que veo?\nUn mundo hermoso, paz y recreo.\nYa no hay tristeza, se fue el dolor;\nDios ha triunfado, venció el amor.\n\n2. El día amanece, respiro paz.\nPor fin el pasado no duele jamás.\nYa siento en mi cara la suave brisa\ny todas mis penas se vuelven sonrisas.\n\n(Estribillo)` },
          'v4': { title: '17. "Quiero"', text: `1. Padeces mucho dolor.\nSufres tal vez por error\nal pensar que eres tú\naquel a quien nadie ama hoy.\nJehová jamás te va a olvidar;\nfíjate bien en Jesús:\nél nunca te abandonará,\nporque de Dios es la luz.\n\n(ESTRIBILLO)\nAl mirar al pobre,\nal ciego o al viudo,\nsiempre dijo "quiero".\nAl mendigo, al cojo,\nal mudo, con amor,\nél sanó diciendo "quiero".\nAl curar con gran compasión,\ndemostró cuánto te ama Jehová.\n\n2. Tal vez no puedas ver hoy\nlo mucho que vale tu amor.\nQuizá pienses de más\ny creas que estorbas a Dios.\nPero Jehová cerca está\nde los que sufren dolor.\nNo dudes nunca de su bondad,\nfíjate en el Creador.\n\n(Estribillo)` },
          'v6': { title: '14. Alabemos al Rey de la eternidad', text: `1. A Jehová cantaremos con júbilo hoy\npor su gloria, grandeza, justicia y amor.\nCielos y Tierra proclaman a una voz:\n"Rey eterno y soberano es nuestro Dios".\n\n(ESTRIBILLO)\nA ti sea la gloria, honor y poder,\npues creaste la vida por tu voluntad.\nTe servimos unidos por todo el saber,\nalabamos al Rey de la eternidad.\n\n2. En su trono en los cielos gobierna Jehová,\nsus caminos son rectos, sus actos verdad.\nTodos los pueblos le deben adoración,\nle rendimos homenaje de corazón.\n\n(Estribillo)` },
          'v8': { title: '23. Jehová da fuerzas', text: `1. Quieres predicar\nsin desfallecer.\nCuando no hay vigor\npara responder,\npiensa que tu Dios\nno te dejará.\nNunca dudes de su amor;\nDios te ayudará.\n\n(ESTRIBILLO)\nTu Señor te cuidará,\nsu poder te sostendrá.\nFuerzas nuevas te dará.\nDigno eres de volar.\nSube al cielo como el águila,\ntu vigor Dios renovará.\n\n2. Sigue a tu Señor\ny no mires atrás.\nNo te cansarás\nsi tú en él confías más.\nSiempre ora a él,\nél responderá.\nPon tu fe y tu corazón;\nDios te ayudará.\n\n(Estribillo)` },
          'v10': { title: '76. ¿Cómo te sientes al ver el final?', text: `1. Al ver que el fin ya se acerca,\n¿sientes terror o sientes paz?\n¿Es un alivio en tu mente\no tienes miedo del final?\nSi hoy te preparas con fe,\ntu alma por fin libre será.\n\n(ESTRIBILLO)\nCuando este mundo se acabe,\nverás que el paraíso está en pie.\nEse es el día anhelado\nque siempre esperaste con fe.\n\n2. Los cielos nuevos, la Tierra,\nya no habrá llanto ni dolor.\nSe acabarán las guerras,\ngobernará nuestro Señor.\nAl ver su rostro al fin,\nle rendiremos alto honor.\n\n(Estribillo)` },
          'v12': { title: '155. ¡Feliz día!', text: `1. Es un día feliz, ¡gloria a Jehová!\nHa llegado el fin de la maldad.\nYa no corre el llanto en nuestro mirar,\nnuestra fe y amor triunfaron al final.\n\n(ESTRIBILLO)\n¡Celebremos ya, cantemos hoy!\nLa promesa cumplida se ve mejor.\nLa vida eterna es una realidad,\nen paz y alegría, ¡feliz día de paz!\n\n2. Trabajando unidos en hermandad,\nconstruyendo juntos este hogar.\nLa paciencia y fe tuvieron lugar,\neste día es nuestro para festejar.\n\n(Estribillo)` },
          's2': { title: '111. "Llamará"', text: `1. Se corta la vida, nos llena el dolor,\nse marcha un amigo, se apaga la luz.\nNo hay forma de echar para atrás el reloj,\nel llanto es amargo, se siente la cruz.\nMas Dios no se olvida, lo tiene en su mente,\nel sueño es muy breve, pronto acabará.\n\n(ESTRIBILLO)\nLlamará. Jehová llamará.\nTodos los muertos se levantarán.\nPara ti, de nuevo habrá luz.\nTus seres queridos muy pronto vendrán.\nJehová por los muertos dará la salud,\nsu amor los hará despertar.\n\n2. El sueño no duele, es un gran letargo,\ntu amigo descansa sin miedo y temor.\nLa angustia no hiere su corazón manso,\nsolo está dormido por un tiempo menor.\nTen fe en la promesa de un mundo distinto,\nel Creador de la vida lo revivirá.\n\n(Estribillo)` },
          's4': { title: '89. Te ruego, oye mi oración', text: `1. Oh, mi Señor, creador universal,\nescucha hoy mi ruego, por favor.\nConoces bien mi alma y mi pesar,\nno quiero nunca herir tu corazón.\n\n(ESTRIBILLO)\nOye mi voz, mi oración, Jehová.\nGuía mis pasos en tu caminar.\nQue mi sendero vaya tras la paz,\ny a tu lado yo me mantendré capaz.\n\n2. El enemigo quiere verme caer,\ntentaciones me asechan sin piedad.\nMas con tu espíritu me sostendré,\ntu amor será mi eterna libertad.\n\n(Estribillo)` },
          's7': { title: '51. Estamos dedicados a Dios', text: `1. Jehová nos atrajo a Jesús con amor.\nA él seguiremos desde hoy.\nCuando la verdad de Dios\nnos llegó al corazón,\ndecidimos prometer\nservir a Dios con gran fe.\n\n(ESTRIBILLO)\nLa vida le hemos dedicado a Dios.\nFelices tomamos la decisión.\n\n2. Dijimos en una oración especial:\n"Por siempre te serviré, Jehová".\nOh, qué gran felicidad\nes hacer su voluntad,\nsu gobierno proclamar,\nsu santo nombre llevar.\n\n(Estribillo)` },
          's9': { title: '125. "Felices los que tienen misericordia"', text: `1. Jehová es el Dios de inmensa compasión,\nconoce muy bien a su gran creación.\nSu misericordia perdura en honor,\nperdona los fallos de su siervo menor.\n\n(ESTRIBILLO)\nFelices los que a otros perdonan,\nque cubren faltas con gran amor.\nLa misma gracia que a otros donan,\nles dará el Gran Creador.\n\n2. El mundo hoy vive en odio y rencor,\nmas nosotros debemos mostrar el favor.\nTratando a todos con franca bondad,\nimitaremos la gran santidad.\n\n(Estribillo)` },
          's11': { title: '81. La vida de un precursor', text: `1. Qué linda es la vida sirviendo a Jehová.\nA todos llevamos consuelo y paz.\nHablando del Reino, logramos llevar\nlas buenas noticias que habrán de llegar.\n\n(ESTRIBILLO)\nSer un precursor es mi vida.\nHablar de tu Reino es honor.\nEnseñar a la gente perdida,\nes algo que me llena de amor.\n\n2. Mis horas, mi esfuerzo, le entrego al Señor.\nYo sé que él aprecia mi humilde labor.\nAmigos sinceros yo pude encontrar,\nsirviendo unidos con mismo afán.\n\n(Estribillo)` },
          's14': { title: '21. "Danos valor"', text: `1. Oh, Padre, hay tantas aflicciones.\nEl mundo nos quiere asustar.\nVivimos en tiempos difíciles,\nno nos queremos callar.\nA veces sentimos que el miedo\nnos nubla el camino a seguir.\n\n(ESTRIBILLO)\nDanos valor, Jehová,\ndanos el pecho para aguantar.\nSostennos la mano, Señor.\nQue nuestra voz brille en verdad.\n\n2. Ayuda a tu pueblo valiente\na nunca dejar tu labor.\nPor más que gobierne la muerte,\npondremos en alto tu honor.\nNos quieres con vida y sanos,\nnos cuidas con tierno candor.\n\n(Estribillo)` },
          'd2': { title: '68. Sigamos el ejemplo del Sembrador', text: `1. Jesús nos enseñó\nque la semilla de verdad\nrequiere tiempo y mucho amor\npara echar raíz sin cesar.\nPor campos trabajamos ya,\nregando toda gran región,\nasí el reino ha de brotar.\n\n(ESTRIBILLO)\nSigamos con firmeza a nuestro Sembrador.\nQue caiga la semilla donde brinde su valor.\nLa lluvia del cielo regará el corazón,\ny el fruto que dará será gran bendición.\n\n2. No todos escuchan, lo sabemos bien.\nMas nunca el gozo se ha de perder.\nHabrá tierra buena, habrá quien nos ve,\nJehová dará fuerzas a quien no se rinde jamás.\n\n(Estribillo)` },
          'd4': { title: '64. Hagamos tu voluntad', text: `1. Qué gran privilegio, Señor Jehová,\npoder tus mensajes de amor anunciar.\nLlevar a la gente tu bella verdad,\ny así tu santísimo nombre alabar.\n\n(ESTRIBILLO)\nHacer tu gran voluntad,\nese es mi mayor deseo, Jehová.\nPredicar en toda ciudad,\nservirte hasta la eternidad.\n\n2. Tu espíritu santo nos da el poder\npara al enemigo lograr someter.\nEl Reino triunfante pronto ha de nacer,\ny todo este mundo tu gloria ha de ver.\n\n(Estribillo)` },
          'd7': { title: '140. Su recompensa es inmensa', text: `1. Qué hermoso es servir, qué noble misión,\nllevando verdades con fiel corazón.\nLa gente nos oye, logramos cambiar\nsus vidas oscuras a luz celestial.\n\n(ESTRIBILLO)\nInmensa será tu gran recompensa,\ntu obra no quedará sin notar.\nSigue con gozo en esta contienda,\nel premio de Dios pronto ha de brillar.\n\n2. Jehova no olvida tu fiel trabajar.\nPor más que te canses, no dejes de orar.\nSus ángeles santos guiando estarán\nlos pasos del manso que ansía obrar.\n\n(Estribillo)` },
          'd9': { title: '108. Alaba a Jehová, oh, alma mía', text: `1. Alaba a Jehová con fuerza,\ncelebra su majestad.\nSus obras son tan grandiosas,\nsu gloria es la verdad.\nTe libró del pozo oscuro,\nte brindó su compasión.\n\n(ESTRIBILLO)\nOh, alma mía, cántale,\noh, corazón, adórale.\nBendice a Jehová hoy siempre,\nagradece su gran don.\n\n2. Recuerda que él es piadoso,\nconoce de qué estás hecho.\nRecuerda que eres de polvo,\nJehová es tu único techo.\nÉl guarda tu vida entera,\nsu gracia te librará.\n\n(Estribillo)` },
          'd11': { title: '120. Escucha, obedece y serás bendecido', text: `1. Escucha atentamente la voz del Creador.\nObedecer sus leyes te salva del dolor.\nJesús dejó el modelo que hay que seguir hoy,\nandemos en sus pasos con gozo y con fervor.\n\n(ESTRIBILLO)\nEscucha y obedece,\nJehová te premiará.\nSu brazo te protege,\nsu luz te alumbrará.\n\n2. Un hombre construía su casa en la arena,\ncayó la tempestad, sufriendo grande pena.\nMas otro con cautela construyó sobre roca,\nsalvó su propia vida y cerró a otros la boca.\n\n(Estribillo)` },
          'd13': { title: '163. A ti te debo la vida', text: `1. Te debo cada latido, mi Creador Jehová.\nLa forma en la que respiro y cómo veo el mar.\nTe debo todas las noches y la inmensidad.\nMas sobre todo te debo, tener la gran verdad.\n\n(ESTRIBILLO)\nTe debo, mi Dios, la vida y el alma entera.\nServir es mi recompensa primera.\nEntregar mi fuerza, cantar en la esfera.\nA ti te debo, Jehová, mi primavera.\n\n2. Compraste hoy mis pecados mediante Jesús.\nMoriste por este esclavo de poca virtud.\nMi gratitud va más allá de esta canción.\nAcepta de forma humilde hoy mi dedicación.\n\n(Estribillo)` }

        function App() {
          const [isDbReady, setIsDbReady] = useState(false);
          const [currentScreen, setCurrentScreen] = useState('login');
          const [currentUser, setCurrentUser] = useState(null);
          
          const [usersDB, setUsersDB] = useState([]);
          const [activeTab, setActiveTab] = useState('viernes');
          const [notes, setNotes] = useState({});
          const [expandedItems, setExpandedItems] = useState({});
          const [fontSize, setFontSize] = useState(16);
          const [isMenuOpen, setIsMenuOpen] = useState(false);
          const [isExporting, setIsExporting] = useState(false);

          const [loginForm, setLoginForm] = useState({ username: '', password: '' });
          const [loginError, setLoginError] = useState('');
          const [isLoggingIn, setIsLoggingIn] = useState(false);
          
          const [newUserForm, setNewUserForm] = useState({ username: '', password: '' });
          const [adminMessage, setAdminMessage] = useState({ type: '', text: '' });
          const [isCreatingUser, setIsCreatingUser] = useState(false);

          // 1. Inicializar Firebase Auth al cargar la app
          useEffect(() => {
            const initAuth = async () => {
              try {
                if (typeof __initial_auth_token !== 'undefined') {
                  await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                  await signInAnonymously(auth);
                }
                setIsDbReady(true);
              } catch (error) {
                console.error("Error autenticando con Firebase:", error);
                setLoginError("Error conectando a la base de datos.");
              }
            };
            initAuth();
          }, []);

          // 2. Auto-guardado de notas (con un pequeño retraso para no saturar Firebase)
          useEffect(() => {
            if (!currentUser || !isDbReady) return;
            
            const timeoutId = setTimeout(async () => {
              try {
                const notesRef = doc(db, 'artifacts', appId, 'public', 'data', 'appNotes', currentUser.username);
                await setDoc(notesRef, { notes, fontSize }, { merge: true });
              } catch (err) {
                console.error("Error guardando en Firebase", err);
              }
            }, 1000); // Guarda 1 segundo después de dejar de escribir
            
            return () => clearTimeout(timeoutId);
          }, [notes, fontSize, currentUser, isDbReady]);

          // ================= LOGICA FIREBASE =================

          // Cargar usuarios para el panel admin
          const loadAllUsers = async () => {
            try {
              const usersRef = collection(db, 'artifacts', appId, 'public', 'data', 'appUsers');
              const snap = await getDocs(usersRef);
              const loadedUsers = [];
              snap.forEach(doc => {
                loadedUsers.push({ username: doc.id, role: doc.data().role });
              });
              setUsersDB(loadedUsers);
            } catch (err) {
              console.error("Error cargando lista de usuarios", err);
            }
          };

          // Función de Inicio de Sesión
          const handleLogin = async () => {
            if (!loginForm.username || !loginForm.password || !isDbReady) return;
            setIsLoggingIn(true);
            setLoginError('');
            
            const uname = loginForm.username.toLowerCase().trim();
            
            try {
              const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'appUsers', uname);
              const userSnap = await getDoc(userRef);

              if (userSnap.exists()) {
                const userData = userSnap.data();
                if (userData.password === loginForm.password) {
                  // Contraseña correcta -> Loguear y descargar sus notas
                  const userObj = { username: uname, role: userData.role };
                  await loadUserNotes(uname);
                  setCurrentUser(userObj);
                  setCurrentScreen('main');
                  setLoginForm({ username: '', password: '' });
                } else {
                  setLoginError('Contraseña incorrecta.');
                }
              } else {
                // Si el usuario "admin" no existe (primera vez usando la app), crearlo.
                if (uname === 'admin' && loginForm.password === 'admin56') {
                  await setDoc(userRef, { password: 'admin56', role: 'admin' });
                  setCurrentUser({ username: 'admin', role: 'admin' });
                  setCurrentScreen('main');
                } else {
                  setLoginError('Usuario no encontrado.');
                }
              }
            } catch (err) {
              console.error(err);
              setLoginError('Error de conexión con el servidor.');
            }
            setIsLoggingIn(false);
          };

          // Cargar notas del usuario logueado
          const loadUserNotes = async (uname) => {
            try {
              const notesRef = doc(db, 'artifacts', appId, 'public', 'data', 'appNotes', uname);
              const notesSnap = await getDoc(notesRef);
              if (notesSnap.exists()) {
                const data = notesSnap.data();
                if (data.notes) setNotes(data.notes);
                if (data.fontSize) setFontSize(data.fontSize);
              } else {
                setNotes({});
                setFontSize(16);
              }
            } catch (err) {
              console.error("Error cargando notas", err);
            }
          };

          // Crear un usuario nuevo (Admin)
          const handleCreateUser = async () => {
            setAdminMessage({ type: '', text: '' });
            if (!newUserForm.username || !newUserForm.password || !isDbReady) return;
            setIsCreatingUser(true);
            
            const uname = newUserForm.username.toLowerCase().trim();
            
            try {
              const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'appUsers', uname);
              const userSnap = await getDoc(userRef);
              
              if (userSnap.exists()) {
                setAdminMessage({ type: 'error', text: 'Ese usuario ya existe.' });
              } else {
                await setDoc(userRef, { password: newUserForm.password, role: 'user' });
                setAdminMessage({ type: 'success', text: 'Usuario creado con éxito.' });
                setNewUserForm({ username: '', password: '' });
                loadAllUsers(); // Refrescar la lista visible
              }
            } catch (err) {
              setAdminMessage({ type: 'error', text: 'Error al conectar con la nube.' });
            }
            
            setIsCreatingUser(false);
            setTimeout(() => setAdminMessage({ type: '', text: '' }), 3000);
          };

          const handleLogout = () => {
            setCurrentUser(null);
            setNotes({});
            setCurrentScreen('login');
            setIsMenuOpen(false);
          };

          const handleNoteChange = (id, text) => setNotes(prev => ({ ...prev, [id]: text }));
          const toggleItem = (id) => setExpandedItems(prev => ({ ...prev, [id]: !prev[id] }));
          const increaseFontSize = () => setFontSize(prev => Math.min(prev + 2, 32));
          const decreaseFontSize = () => setFontSize(prev => Math.max(prev - 2, 12));

          // ================= RENDERIZADO =================

          const handleExportPDF = () => {
            setIsMenuOpen(false);
            setIsExporting(true);

            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
            
            script.onload = () => {
              const element = document.createElement('div');
              element.style.padding = '30px';
              element.style.fontFamily = 'Arial, sans-serif';
              element.style.color = '#334155';
              
              let html = `<h1 style="color: #0369a1; text-align: center; margin-bottom: 5px;">Felices para siempre</h1><p style="text-align: center; color: #64748b; margin-top: 0; margin-bottom: 30px;">Asamblea de 2026<br><small>Usuario: ${currentUser?.username}</small></p>`;
              
              let hasNotes = false;
              ['viernes', 'sabado', 'domingo'].forEach(tab => {
                let sectionHasNotes = false;
                let tabName = tab.toUpperCase();
                let sectionHtml = `<h2 style="color: #0369a1; margin-top: 30px; border-bottom: 2px solid #e0f2fe; padding-bottom: 8px;">${tabName}</h2>`;

                program[tab].forEach(item => {
                  if (notes[item.id] && notes[item.id].trim() !== '') {
                    sectionHtml += `<h3 style="color: #0f172a; margin-top: 20px; margin-bottom: 10px; font-size: 16px;">■ ${item.title}</h3><div style="white-space: pre-wrap; background-color: #f8fafc; padding: 15px; border-radius: 8px; border-left: 4px solid #0284c7; font-size: 14px; line-height: 1.6;">${notes[item.id]}</div>`;
                    sectionHasNotes = true;
                    hasNotes = true;
                  }
                  
                  if (item.type === 'symposium') {
                    item.parts.forEach(part => {
                      if (notes[part.id] && notes[part.id].trim() !== '') {
                        sectionHtml += `<h4 style="color: #334155; margin-top: 15px; margin-bottom: 10px; margin-left: 20px; font-size: 15px;">○ ${part.title}</h4><div style="white-space: pre-wrap; background-color: #f8fafc; padding: 15px; border-radius: 8px; margin-left: 20px; border-left: 4px solid #38bdf8; font-size: 14px; line-height: 1.6;">${notes[part.id]}</div>`;
                        sectionHasNotes = true;
                        hasNotes = true;
                      }
                    });
                  }
                });

                if (sectionHasNotes) html += sectionHtml;
              });

              if (!hasNotes) html += '<p style="text-align: center; margin-top: 40px; color: #94a3b8;">Aún no has escrito ningún apunte.</p>';
              
              element.innerHTML = html;
              
              const opt = {
                margin:       15,
                filename:     `Apuntes_${currentUser?.username}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
              };
              
              window.html2pdf().set(opt).from(element).save().then(() => setIsExporting(false));
            };
            document.body.appendChild(script);
          };

          if (currentScreen === 'login') {
            return (
              <div className="min-h-screen flex flex-col justify-center items-center p-4 relative overflow-hidden bg-slate-100">
                <div className="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200 relative z-10">
                  <div className="bg-sky-800 p-8 text-center relative overflow-hidden">
                    <div className="absolute top-0 right-0 -mr-8 -mt-8 w-32 h-32 rounded-full bg-white/10 blur-xl"></div>
                    <div className="absolute bottom-0 left-0 -ml-8 -mb-8 w-24 h-24 rounded-full bg-white/10 blur-lg"></div>
                    <h1 className="text-3xl font-bold text-white mb-2 relative z-10 font-serif italic">Felices para siempre</h1>
                    <p className="text-sky-200 text-sm uppercase tracking-wider relative z-10 font-bold">Asamblea 2026</p>
                  </div>
                  <div className="p-8">
                    <h2 className="text-slate-800 font-bold text-center mb-6">Mis Apuntes (Nube)</h2>
                    {!isDbReady ? (
                      <div className="flex flex-col items-center justify-center p-6 text-sky-700">
                        <Loader2 className="animate-spin mb-2" size={32} />
                        <span className="font-semibold text-sm">Conectando a Firebase...</span>
                      </div>
                    ) : (
                      <div className="space-y-5">
                        {loginError && <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm text-center border border-red-200">{loginError}</div>}
                        <div>
                          <label className="block text-sm font-semibold text-slate-700 mb-1">Usuario</label>
                          <input 
                            type="text" value={loginForm.username}
                            onChange={(e) => setLoginForm({...loginForm, username: e.target.value})}
                            className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none bg-slate-50"
                          />
                        </div>
                        <div>
                          <label className="block text-sm font-semibold text-slate-700 mb-1">Contraseña</label>
                          <input 
                            type="password" value={loginForm.password}
                            onChange={(e) => setLoginForm({...loginForm, password: e.target.value})}
                            className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none bg-slate-50"
                          />
                        </div>
                        <button onClick={handleLogin} disabled={isLoggingIn} className="w-full bg-sky-700 text-white font-bold py-3 rounded-lg hover:bg-sky-800 transition-colors shadow-md mt-2 flex justify-center items-center disabled:opacity-70">
                          {isLoggingIn ? <Loader2 className="animate-spin" size={20} /> : 'Ingresar'}
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            );
          }

          if (currentScreen === 'admin') {
            return (
              <div className="min-h-screen bg-slate-100 p-4 pb-20">
                <div className="max-w-2xl mx-auto">
                  <button onClick={() => setCurrentScreen('main')} className="flex items-center gap-2 text-sky-700 font-bold mb-6 hover:text-sky-900 transition-colors">
                    <ArrowLeft size={20} /> Volver al Programa
                  </button>

                  <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mb-6">
                    <div className="bg-sky-800 p-6 text-white flex justify-between items-center">
                      <div>
                        <h1 className="text-xl font-bold">Gestión de Usuarios</h1>
                        <p className="text-sky-200 text-sm">Crea accesos en la nube</p>
                      </div>
                      <div className="bg-white/20 p-3 rounded-xl text-center min-w-[80px]">
                        <span className="block text-2xl font-bold leading-none">{usersDB.length}</span>
                        <span className="text-xs uppercase tracking-wider font-semibold">Usuarios</span>
                      </div>
                    </div>

                    <div className="p-6">
                      <h2 className="font-bold text-slate-800 mb-4 flex items-center gap-2">
                        <UserPlus size={18} className="text-sky-600"/> Crear Nuevo Usuario
                      </h2>
                      
                      {adminMessage.text && (
                        <div className={`p-3 rounded-lg text-sm font-semibold mb-4 border transition-all ${adminMessage.type === 'error' ? 'bg-red-50 text-red-600 border-red-200' : 'bg-emerald-50 text-emerald-700 border-emerald-200'}`}>
                          {adminMessage.text}
                        </div>
                      )}
                      
                      <div className="space-y-4 bg-slate-50 p-5 rounded-xl border border-slate-100">
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-sm font-semibold text-slate-700 mb-1">Nombre de usuario</label>
                            <input 
                              type="text" value={newUserForm.username}
                              onChange={(e) => setNewUserForm({...newUserForm, username: e.target.value})}
                              className="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none"
                            />
                          </div>
                          <div>
                            <label className="block text-sm font-semibold text-slate-700 mb-1">Contraseña</label>
                            <input 
                              type="text" value={newUserForm.password}
                              onChange={(e) => setNewUserForm({...newUserForm, password: e.target.value})}
                              className="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none"
                            />
                          </div>
                        </div>
                        <button onClick={handleCreateUser} disabled={isCreatingUser} className="w-full bg-slate-700 text-white font-bold py-2.5 rounded-lg hover:bg-slate-800 transition-colors flex justify-center disabled:opacity-70">
                          {isCreatingUser ? <Loader2 className="animate-spin" size={20} /> : 'Registrar en Nube'}
                        </button>
                      </div>
                    </div>
                    
                    <div className="p-6 border-t border-slate-100">
                      <div className="flex justify-between items-center mb-4">
                        <h2 className="font-bold text-slate-800">Lista de Accesos</h2>
                        <button onClick={loadAllUsers} className="text-xs bg-sky-100 text-sky-700 px-3 py-1 rounded font-bold hover:bg-sky-200">Refrescar</button>
                      </div>
                      <ul className="space-y-2">
                        {usersDB.map((u, i) => (
                          <li key={i} className="flex justify-between items-center p-3 bg-white border border-slate-200 rounded-lg text-sm shadow-sm">
                            <span className="font-semibold text-slate-700">{u.username}</span>
                            <span className="text-slate-500 bg-slate-100 border border-slate-200 px-2 py-0.5 rounded text-xs">{u.role === 'admin' ? 'Administrador' : 'Usuario'}</span>
                          </li>
                        ))}
                        {usersDB.length === 0 && <li className="text-sm text-slate-500 text-center py-4">Toca Refrescar para ver la lista.</li>}
                      </ul>
                    </div>
                  </div>
                </div>
              </div>
            );
          }

          const renderNoteField = (id, placeholder = "Escribe tus apuntes aquí...") => (
            <div className="mt-3 relative">
              <textarea
                className="w-full p-4 border border-slate-300 rounded-lg shadow-inner bg-slate-50 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white transition-colors overflow-hidden resize-none min-h-[120px] text-slate-700"
                style={{ fontSize: `${fontSize}px` }}
                placeholder={placeholder}
                value={notes[id] || ''}
                onChange={(e) => {
                  handleNoteChange(id, e.target.value);
                  e.target.style.height = 'auto';
                  e.target.style.height = e.target.scrollHeight + 'px';
                }}
                ref={(el) => {
                  if (el) {
                    el.style.height = 'auto';
                    el.style.height = el.scrollHeight + 'px';
                  }
                }}
              />
            </div>
          );

          return (
            <div className="min-h-screen bg-slate-100 text-slate-800 font-sans pb-20 relative">
              {isMenuOpen && <div className="fixed inset-0 z-40 bg-black/10 backdrop-blur-sm" onClick={() => setIsMenuOpen(false)}></div>}

              <header className="bg-sky-800 text-white p-6 shadow-md rounded-b-2xl relative z-50">
                <div className="absolute top-4 left-4 text-xs bg-white/20 px-3 py-1 rounded-full font-semibold">{currentUser?.username}</div>
                <button onClick={() => setIsMenuOpen(!isMenuOpen)} className="absolute top-2 right-4 p-2 bg-white/10 rounded-full hover:bg-white/20 transition-colors">
                  <MoreVertical size={24} />
                </button>

                {isMenuOpen && (
                  <div className="absolute top-14 right-4 w-64 bg-white rounded-xl shadow-xl border border-slate-200 overflow-hidden text-slate-800">
                    <div className="p-4 border-b border-slate-100">
                      <div className="flex items-center gap-2 mb-2 text-sm font-semibold text-slate-600">
                        <Type size={16} /> <span>Tamaño del texto: {fontSize}</span>
                      </div>
                      <div className="flex bg-slate-100 rounded-lg overflow-hidden w-full">
                        <button onClick={decreaseFontSize} className="flex-1 py-2 font-bold hover:bg-slate-200 border-r border-slate-200">-</button>
                        <button onClick={increaseFontSize} className="flex-1 py-2 font-bold hover:bg-slate-200">+</button>
                      </div>
                    </div>
                    <div className="p-2 border-b border-slate-100">
                      <button onClick={handleExportPDF} disabled={isExporting} className="w-full flex items-center gap-3 px-3 py-3 hover:bg-sky-50 hover:text-sky-700 rounded-lg text-left disabled:opacity-50">
                        <FileText size={20} className="text-sky-600 shrink-0" />
                        <span className="font-medium">{isExporting ? 'Generando PDF...' : 'Exportar como PDF'}</span>
                      </button>
                      {currentUser?.role === 'admin' && (
                        <button onClick={() => { setIsMenuOpen(false); setCurrentScreen('admin'); loadAllUsers(); }} className="w-full flex items-center gap-3 px-3 py-3 mt-1 hover:bg-slate-100 hover:text-slate-800 rounded-lg text-left">
                          <Users size={20} className="text-slate-600 shrink-0" />
                          <span className="font-medium">Usuarios (Nube)</span>
                        </button>
                      )}
                    </div>
                    <div className="p-2">
                      <button onClick={handleLogout} className="w-full flex items-center gap-3 px-3 py-3 hover:bg-red-50 hover:text-red-700 rounded-lg text-left text-red-600">
                        <LogOut size={20} className="shrink-0" />
                        <span className="font-medium">Cerrar Sesión</span>
                      </button>
                    </div>
                  </div>
                )}

                <h1 className="text-2xl font-bold text-center mb-1 mt-5 font-serif italic">"Felices para siempre"</h1>
                <p className="text-center text-sky-200 text-xs mb-4 font-bold tracking-widest uppercase">Asamblea del 2026</p>
                <div className="bg-white/10 p-4 rounded-xl text-center border border-sky-400/30">
                  <h2 className="text-xl font-medium mb-1">"Felices los que reconocen sus necesidades espirituales"</h2>
                  <span className="text-sm font-semibold text-sky-300">MATEO 5:3</span>
                </div>
              </header>

              <div className="flex justify-center gap-2 p-4 sticky top-0 bg-slate-100/90 backdrop-blur-sm z-10">
                <button onClick={() => setActiveTab('viernes')} className={`flex-1 py-3 px-1 rounded-xl flex flex-col items-center justify-center gap-1 font-bold text-sm transition-all ${activeTab === 'viernes' ? 'bg-sky-800 text-white shadow-lg' : 'bg-white text-slate-600 border border-slate-200 shadow-sm'}`}>
                  <Calendar size={18} className={activeTab === 'viernes' ? 'text-sky-200' : 'text-slate-400'}/> Vie
                </button>
                <button onClick={() => setActiveTab('sabado')} className={`flex-1 py-3 px-1 rounded-xl flex flex-col items-center justify-center gap-1 font-bold text-sm transition-all ${activeTab === 'sabado' ? 'bg-sky-800 text-white shadow-lg' : 'bg-white text-slate-600 border border-slate-200 shadow-sm'}`}>
                  <Calendar size={18} className={activeTab === 'sabado' ? 'text-sky-200' : 'text-slate-400'}/> Sáb
                </button>
                <button onClick={() => setActiveTab('domingo')} className={`flex-1 py-3 px-1 rounded-xl flex flex-col items-center justify-center gap-1 font-bold text-sm transition-all ${activeTab === 'domingo' ? 'bg-sky-800 text-white shadow-lg' : 'bg-white text-slate-600 border border-slate-200 shadow-sm'}`}>
                  <Calendar size={18} className={activeTab === 'domingo' ? 'text-sky-200' : 'text-slate-400'}/> Dom
                </button>
              </div>

              <main className="max-w-2xl mx-auto px-4 mt-2">
                <div className="space-y-4">
                  {program[activeTab].map((item) => (
                    <div key={item.id} className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
                      <div className="flex items-start gap-4">
                        <div className="bg-sky-100 text-sky-900 font-bold py-1 px-3 rounded-lg text-sm flex items-center shrink-0 mt-1">
                          <Clock size={14} className="mr-1 text-sky-700" /> {item.time}
                        </div>
                        <div className="flex-1">
                          <div className={`flex justify-between items-start ${item.type === 'talk' || item.type === 'song' ? 'cursor-pointer select-none' : ''}`} onClick={item.type === 'talk' || item.type === 'song' ? () => toggleItem(item.id) : undefined}>
                            <h3 className={`font-bold ${item.type === 'music' ? 'text-slate-400' : (item.type === 'song' ? 'text-sky-700 text-lg' : 'text-slate-800 text-lg')}`}>{item.title}</h3>
                            {(item.type === 'talk' || item.type === 'song') && (expandedItems[item.id] ? <ChevronUp size={20} className="text-sky-500 shrink-0 ml-2 mt-1" /> : <ChevronDown size={20} className="text-sky-500 shrink-0 ml-2 mt-1" />)}
                          </div>
                        </div>
                      </div>
                      {item.type === 'song' && expandedItems[item.id] && songLyrics[item.id] && (
                        <div className="mt-4 p-5 bg-sky-50 rounded-xl border border-sky-100 text-slate-800 whitespace-pre-wrap leading-relaxed italic shadow-inner" style={{ fontSize: `${fontSize}px` }}>
                          <h4 className="font-bold text-sky-900 mb-3 not-italic text-lg">{songLyrics[item.id].title}</h4>{songLyrics[item.id].text}
                        </div>
                      )}
                      {item.type === 'talk' && expandedItems[item.id] && (<div className="mt-3">{renderNoteField(item.id)}</div>)}
                      {item.type === 'symposium' && (
                        <div className="mt-5 space-y-5">
                          {item.parts.map(part => (
                            <div key={part.id} className="pt-3 border-t border-slate-100">
                              <div className="cursor-pointer select-none flex justify-between items-start" onClick={() => toggleItem(part.id)}>
                                <h4 className="font-semibold text-slate-700 flex items-start gap-2"><BookOpen size={16} className="text-sky-600 mt-1 shrink-0" /> <span>{part.title}</span></h4>
                                {expandedItems[part.id] ? <ChevronUp size={20} className="text-sky-600 shrink-0 ml-2 mt-1" /> : <ChevronDown size={20} className="text-sky-600 shrink-0 ml-2 mt-1" />}
                              </div>
                              {expandedItems[part.id] && renderNoteField(part.id)}
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </main>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
